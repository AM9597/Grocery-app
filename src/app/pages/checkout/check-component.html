<div class="container mx-auto p-4 max-w-lg">
  <h2 class="text-xl font-bold mb-4">Checkout</h2>
  <form (ngSubmit)="submit()" #f="ngForm">
    <input name="name" [(ngModel)]="name" placeholder="Name" required class="input" />
    <input name="mobile" [(ngModel)]="mobile" placeholder="Mobile" required class="input" />
    <textarea
      name="address"
      [(ngModel)]="address"
      placeholder="Address"
      required
      class="input"
    ></textarea>

    <div class="mt-4">
      <label><input type="checkbox" [(ngModel)]="cod" name="cod" /> Cash on pickup</label>
    </div>

    <button class="btn mt-4" type="submit">Place Order</button>
  </form>
</div>
